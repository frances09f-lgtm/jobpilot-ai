name: Analyze, test and build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jobpilot-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Inspect environment
        run: |
          flutter --version
          flutter doctor -v
          java -version
      - name: Prepare maintenance sources
        run: python3 tool/prepare_sources.py
      - name: Resolve dependencies
        run: flutter pub get
      - name: Commit maintained source and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android .metadata pubspec.lock pubspec.yaml lib test README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Persist maintained profile, logo and sample visibility source [skip ci]'
            git push origin HEAD:main
          fi
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test --reporter expanded
      - name: Build release APK (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64 --split-debug-info=build/symbols
      - name: Report APK size and native components
        run: |
          ls -l build/app/outputs/flutter-apk/
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as z:
              for i in sorted((i for i in z.infolist() if i.filename.endswith('.so')), key=lambda i: i.file_size, reverse=True):
                  print(f'{i.filename}: {i.file_size} unpacked bytes, {i.compress_size} ZIP bytes')
          PY
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobPilot-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk JobPilot-AI.apk
          NOTES='Phase 1: offline resume prefill and matching, manual tracker, fictional sample jobs with a hide switch. Original vector logo. arm64-v8a only. R8/resource shrinking. Analyze and tests passed in this CI run. Development debug-key signing. Owner tested the earlier MVP; this maintenance build has not been tested on a phone.'
          gh release upload v0.1.0 JobPilot-AI.apk --clobber
          gh release edit v0.1.0 --notes "$NOTES"
