name: Analyze, test and build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jobpilot-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Inspect environment
        run: |
          flutter --version
          flutter doctor -v
          java -version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test --reporter expanded
      - name: Build release APK (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64 --split-debug-info=build/symbols --tree-shake-icons
      - name: Report APK size and native components
        run: |
          ls -l build/app/outputs/flutter-apk/
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as z:
              for i in sorted((i for i in z.infolist() if i.filename.endswith('.so')), key=lambda i: i.file_size, reverse=True):
                  print(f'{i.filename}: {i.file_size} unpacked bytes, {i.compress_size} ZIP bytes')
          PY
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobPilot-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk JobPilot-AI.apk
          python3 - <<'PY'
          import json, re, hashlib
          from pathlib import Path
          version = re.search(r'^version:\s*(\S+)', Path('pubspec.yaml').read_text(), re.M).group(1)
          apk = Path('JobPilot-AI.apk')
          data = {'version': version, 'apk_url': 'https://github.com/frances09f-lgtm/jobpilot-ai/releases/download/v0.1.0/JobPilot-AI.apk', 'size_bytes': apk.stat().st_size, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest()}
          Path('jobpilot-release.json').write_text(json.dumps(data))
          PY
          VERSION=$(python3 -c "import json; print(json.load(open('jobpilot-release.json'))['version'])")
          NOTES="JobPilot $VERSION: no demo jobs or sample badges, local manual jobs, address/PIN prefill, optional device-key Groq ranking with offline fallback and in-app update check. Version metadata accompanies the fixed v0.1.0 APK link. Analyze and tests passed in this CI run. Groq and updater HTTP tests use mocks; no authenticated Groq call or phone test was performed. arm64-v8a only, R8/resource shrinking, development debug-key signing."
          gh release upload v0.1.0 JobPilot-AI.apk jobpilot-release.json --clobber
          gh release edit v0.1.0 --title "JobPilot AI $VERSION" --notes "$NOTES"
