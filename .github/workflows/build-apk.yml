name: Analyze, test and build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jobpilot-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Inspect environment
        run: |
          flutter --version
          flutter doctor -v
          java -version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test --reporter expanded
      - name: Build release APK (arm64-v8a only)
        run: flutter build apk --release --target-platform android-arm64 --split-debug-info=build/symbols --tree-shake-icons
      - name: Report APK size and native components
        run: |
          ls -l build/app/outputs/flutter-apk/
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as z:
              for i in sorted((i for i in z.infolist() if i.filename.endswith('.so')), key=lambda i: i.file_size, reverse=True):
                  print(f'{i.filename}: {i.file_size} unpacked bytes, {i.compress_size} ZIP bytes')
          PY
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobPilot-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk JobPilot-AI.apk
          NOTES='JobPilot 0.1.1+4: no bundled demo jobs, legacy demo migration, local manual jobs and tracker, address/PIN resume prefill, original navy/blue/violet logo. Optional Groq ranking with your device-stored key; offline fallback on errors, invalid key and rate limits. Analyze and tests passed in this CI run. Groq transport/validation uses mocked tests; no real key or live authenticated Groq call was tested. arm64-v8a only, R8/resource shrinking, development debug-key signing. Not tested on a phone.'
          gh release upload v0.1.0 JobPilot-AI.apk --clobber
          gh release edit v0.1.0 --notes "$NOTES"
